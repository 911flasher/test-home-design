<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GardenMakeover - Interactive Ad</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            overflow: hidden;
            height: 100vh;
        }
        
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        
        .ui-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
        
        .header {
            position: absolute;
            top: 10px;
            left: 10px;
            right: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            pointer-events: auto;
            z-index: 100;
        }
        
        .title {
            color: white;
            font-size: 24px;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }
        
        .day-night-toggle {
            background: rgba(0,0,0,0.3);
            border: 2px solid white;
            border-radius: 25px;
            padding: 5px;
            display: flex;
            gap: 5px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .day-night-toggle:hover {
            background: rgba(0,0,0,0.5);
        }
        
        .day-night-toggle button {
            background: transparent;
            border: none;
            color: white;
            cursor: pointer;
            padding: 8px 12px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
            transition: all 0.3s ease;
        }
        
        .day-night-toggle button.active {
            background: rgba(255,255,255,0.3);
        }
        
        .language-toggle {
            background: rgba(0,0,0,0.3);
            border: 2px solid white;
            border-radius: 25px;
            padding: 5px;
            display: flex;
            gap: 5px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .language-toggle:hover {
            background: rgba(0,0,0,0.5);
        }
        
        .language-toggle button {
            background: transparent;
            border: none;
            color: white;
            cursor: pointer;
            padding: 8px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            transition: all 0.3s ease;
        }
        
        .language-toggle button.active {
            background: rgba(255,255,255,0.3);
        }

        .icon-btn {
            background: rgba(0,0,0,0.3);
            border: 2px solid white;
            border-radius: 999px;
            color: white;
            cursor: pointer;
            width: 46px;
            height: 46px;
            font-size: 18px;
            font-weight: bold;
            transition: transform 0.25s ease, background 0.25s ease, opacity 0.25s ease;
        }

        .icon-btn:hover {
            background: rgba(0,0,0,0.5);
            transform: translateY(-2px) scale(1.04);
        }

        .icon-btn.muted {
            opacity: 0.65;
        }
        
        .controls {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
            pointer-events: auto;
            max-width: 90%;
        }
        
        .category-btn {
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            background: rgba(255,255,255,0.2);
            color: white;
            border: 2px solid white;
            min-width: 100px;
        }
        
        .category-btn:hover {
            background: rgba(255,255,255,0.4);
            transform: scale(1.05);
        }
        
        .category-btn.active {
            background: #FF6B6B;
            border-color: #FF6B6B;
        }
        
        .items-container {
            position: absolute;
            bottom: 90px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
            pointer-events: auto;
            max-width: 90%;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        
        .items-container.active {
            opacity: 1;
        }
        
        .item-btn {
            width: 70px;
            height: 70px;
            border: 2px solid white;
            border-radius: 8px;
            background: rgba(255,255,255,0.2);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            pointer-events: auto;
        }
        
        .item-btn img {
            width: 90%;
            height: 90%;
            object-fit: contain;
        }
        
        .item-btn:hover {
            background: rgba(255,255,255,0.4);
            transform: scale(1.1);
        }
        
        .item-btn.selected {
            background: #4CAF50;
            border-color: #4CAF50;
        }
        
        .tutorial {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.8);
            color: white;
            padding: 40px;
            border-radius: 15px;
            text-align: center;
            max-width: 400px;
            pointer-events: auto;
            z-index: 200;
            display: none;
        }
        
        .tutorial.show {
            display: block;
        }
        
        .tutorial h2 {
            margin-bottom: 20px;
            font-size: 26px;
        }
        
        .tutorial p {
            margin-bottom: 15px;
            font-size: 16px;
            line-height: 1.5;
        }
        
        .tutorial button {
            background: #FF6B6B;
            border: none;
            color: white;
            padding: 12px 30px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 20px;
        }
        
        .tutorial button:hover {
            background: #FF5252;
            transform: scale(1.05);
        }
        
        .info-label {
            position: absolute;
            top: 80px;
            left: 10px;
            background: rgba(0,0,0,0.6);
            color: white;
            padding: 10px 15px;
            border-radius: 8px;
            font-size: 14px;
            pointer-events: auto;
            max-width: 200px;
            word-wrap: break-word;
        }
        
        .stats {
            position: absolute;
            top: 138px;
            left: 10px;
            background: rgba(0,0,0,0.6);
            color: white;
            padding: 15px;
            border-radius: 8px;
            font-size: 14px;
            pointer-events: auto;
            text-align: left;
            min-width: 200px;
        }
        
        .stats-item {
            margin-bottom: 8px;
            font-weight: 500;
        }
        
        .download-btn {
            position: absolute;
            top: 80px;
            right: 10px;
            background: linear-gradient(135deg, #FF6B6B, #FF5252);
            border: none;
            color: white;
            padding: 12px 25px;
            border-radius: 25px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            pointer-events: auto;
            box-shadow: 0 4px 15px rgba(255, 107, 107, 0.4);
        }
        
        .download-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 20px rgba(255, 107, 107, 0.6);
        }

        .pointer-notifications {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 350;
        }

        .pointer-note {
            position: fixed;
            left: 0;
            top: 0;
            padding: 10px 14px;
            border-radius: 999px;
            color: white;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 0.01em;
            white-space: nowrap;
            transform: translate(-50%, -50%) scale(0.7);
            opacity: 0;
            animation: pointer-note-rise 1s ease forwards;
            box-shadow: 0 12px 24px rgba(0, 0, 0, 0.24);
            backdrop-filter: blur(8px);
        }

        .pointer-note.info {
            background: linear-gradient(135deg, rgba(37, 99, 235, 0.95), rgba(6, 182, 212, 0.95));
        }

        .pointer-note.success {
            background: linear-gradient(135deg, rgba(34, 197, 94, 0.95), rgba(132, 204, 22, 0.95));
        }

        .pointer-note.warning {
            background: linear-gradient(135deg, rgba(249, 115, 22, 0.96), rgba(239, 68, 68, 0.96));
        }

        @keyframes pointer-note-rise {
            0% {
                opacity: 0;
                transform: translate(-50%, -50%) scale(0.7);
            }
            20% {
                opacity: 1;
                transform: translate(-50%, -62%) scale(1);
            }
            100% {
                opacity: 0;
                transform: translate(-50%, -120%) scale(0.92);
            }
        }
        
        @media (max-width: 768px) {
            .title {
                font-size: 18px;
            }
            
            .category-btn {
                padding: 10px 15px;
                font-size: 12px;
                min-width: 80px;
            }
            
            .item-btn {
                width: 60px;
                height: 60px;
            }
            
            .tutorial {
                padding: 30px 20px;
            }

            .stats {
                top: 148px;
                left: 10px;
                right: auto;
            }
        }
    </style>
</head>
<body>
    <div class="ui-container">
        <div class="header">
            <div class="title" id="titleText">🌳 GardenMakeover</div>
            <div style="display: flex; gap: 15px; align-items: center;">
                <div class="day-night-toggle">
                    <button id="dayBtn" class="active">☀️ Day</button>
                    <button id="nightBtn">🌙 Night</button>
                </div>
                <div class="language-toggle">
                    <button id="langEnBtn" class="active" data-lang="en">EN</button>
                    <button id="langRuBtn" data-lang="ru">РУ</button>
                </div>
                <button class="icon-btn" id="muteBtn" type="button" aria-label="Mute or unmute sounds">🔊</button>
            </div>
        </div>
        
        <div class="info-label" id="infoLabel">Click on garden area to place items</div>
        
        <div class="stats" id="stats">
            <div class="stats-item">📊 Items: <span id="itemCount">0</span></div>
            <div class="stats-item">🌱 Plants: <span id="plantCount">0</span></div>
            <div class="stats-item">🪑 Furniture: <span id="furnitureCount">0</span></div>
            <div class="stats-item">🐄 Animals: <span id="animalCount">0</span></div>
        </div>
        
        <button class="download-btn" id="downloadBtn">📥 Download App</button>
        
        <div class="tutorial" id="tutorial">
            <h2 id="tutorialTitle">Welcome to GardenMakeover! 🌻</h2>
            <p id="tutorialLine1">1. Choose a category (Plants, Furniture, Animals)</p>
            <p id="tutorialLine2">2. Select an item</p>
            <p id="tutorialLine3">3. Click on the garden area to place it</p>
            <p id="tutorialLine4">4. Try the Day/Night toggle!</p>
            <button id="tutorialBtn" onclick="document.getElementById('tutorial').classList.remove('show')">Start!</button>
        </div>
        
        <div class="controls" id="controls">
            <button class="category-btn" data-category="plants">🌱 Plants</button>
            <button class="category-btn" data-category="furniture">🪑 Furniture</button>
            <button class="category-btn" data-category="animals">🐄 Animals</button>
        </div>
        
        <div class="items-container" id="itemsContainer"></div>
        <div class="pointer-notifications" id="pointerNotifications"></div>
    </div>
    
    <script type="module" src="./main.js"></script>
</body>
</html>
